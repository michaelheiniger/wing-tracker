# Gradle's default heap is too small for a build from scratch (as on CI) since the shared UI module grew: compiling it
# ran out of memory. The Kotlin compiler runs in a daemon of its own, so it gets its own limit.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
