name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows too, so a Windows-only bug is caught here and not by the release (ADR 0025).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git's bash on Windows too, so the steps read the same on both.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Must match the jvmToolchain declared in build-logic.
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check
