name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Must match the jvmToolchain declared in build-logic.
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check
