name: Release

# Releasing = running this workflow by hand with the version (ADR 0009). Each OS builds and checks its installer in its
# own job (ADR 0025); only when all succeed does the last job compute the checksums, date the Unreleased section of
# CHANGELOG.md, commit it, tag and publish. A dry run builds everything and uploads the installers as an artifact,
# but changes nothing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as MAJOR.MINOR.PATCH without a leading v
        required: true
      dry_run:
        description: Dry run (build and upload the installers only; no commit, tag or release)
        type: boolean
        default: false

permissions:
  contents: write

# Two releases at once would race on the changelog and the tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  # Fails fast, before the long builds, when the request cannot be released.
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the request
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases are made from main, not from $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The version must look like 1.2.3 (ADR 0009), got '$VERSION'" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          # The whole history, so an existing tag of this version is found.
          fetch-depth: 0
      - name: Check that the version is new
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "The tag v$VERSION already exists" >&2
            exit 1
          fi
      - name: Check that there is something to release
        # Dates the section in this job's copy only; the publish job does it for real once everything is built.
        run: scripts/changelog-release.sh "$VERSION"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            task: packageDeb
            format: deb
          - os: windows-2025
            task: packageMsi
            format: msi
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git's bash on Windows too, so the steps read the same on both.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Must match the jvmToolchain declared in build-logic.
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install packaging tools
        if: matrix.format == 'deb'
        # jpackage builds the .deb with these; installing them keeps the build independent of the runner image.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg-dev
      - name: Build and verify
        run: ./gradlew check :app-desktop:${{ matrix.task }} -PappVersion="$VERSION"
      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.format }}
          path: app-desktop/build/compose/binaries/main/${{ matrix.format }}/*.${{ matrix.format }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Collect the installers
        uses: actions/download-artifact@v7
        with:
          pattern: installer-*
          path: release
          merge-multiple: true
      - name: Compute checksums
        # The built-in updater refuses an installer whose checksum does not match this file (ADR 0024). Computed
        # next to the installers, so the file lists bare file names, the same ones the release assets get.
        working-directory: release
        run: |
          sha256sum *.deb *.msi > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Upload the release files
        uses: actions/upload-artifact@v7
        with:
          name: wing-tracker-${{ env.VERSION }}
          path: release/*
          if-no-files-found: error
      - name: Commit the changelog and tag the release
        if: env.DRY_RUN != 'true'
        run: |
          scripts/changelog-release.sh "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Release $VERSION"
          git tag "v$VERSION"
          # One push, so the commit and the tag arrive together or not at all (e.g. when main moved meanwhile).
          git push --atomic origin HEAD:main "v$VERSION"
      - name: Publish GitHub Release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/changelog-section.sh "$VERSION" > release-notes.md
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            release/*
