name: Release

# Releasing = pushing a vMAJOR.MINOR.PATCH tag (ADR 0009).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and verify
        run: ./gradlew check :app-desktop:packageDeb -PappVersion="${GITHUB_REF_NAME#v}"
      - name: Extract release notes for this version
        run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            app-desktop/build/compose/binaries/main/deb/*.deb
